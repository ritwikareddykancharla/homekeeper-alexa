<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HomeKeeper on Alexa+ (simulated)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        <span>Alexa+ <em>simulated host</em></span>
      </div>
      <div class="status" id="status">Connecting</div>
    </header>

    <main class="stage">
      <section class="transcript" id="transcript">
        <div class="hint">
          <h1>HomeKeeper</h1>
          <p>Your home's memory, on Alexa+. Ask about any appliance in the house, or press the microphone to talk.</p>
          <div class="chips" id="suggestions">
            <button data-say="What appliances do I have?">What appliances do I have?</button>
            <button data-say="The dishwasher is showing E24">The dishwasher is showing E24</button>
            <button data-say="What needs attention this month?">What needs attention this month?</button>
            <button data-say="My coffee maker only brews half a cup">My coffee maker only brews half a cup</button>
            <button data-say="Order a new water filter for the fridge">Order a new water filter for the fridge</button>
            <button data-say="Is the washer still under warranty?">Is the washer still under warranty?</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="composer">
      <div class="orb" id="orb" title="Alexa's light"></div>
      <form id="form">
        <input id="input" type="text" placeholder="Say something to Alexa" autocomplete="off" />
        <button type="button" id="mic" title="Talk live with Nova 2 Sonic. Press again to hang up." aria-label="Talk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          Talk
        </button>
        <button type="submit" title="Send">Send</button>
      </form>
      <div class="voicerow">
        <label class="voice"><input type="checkbox" id="tts" checked /> Read replies aloud</label>
        <select id="voicePick" class="voicepick" title="Polly voice"></select>
      </div>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
