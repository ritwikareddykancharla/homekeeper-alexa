name: Deploy demo host

# Every push to main pulls, rebuilds and restarts the simulated Alexa+ host
# behind https://d157gr6uv21vdd.cloudfront.net. The job assumes an AWS role
# through GitHub's OIDC provider (created by the HomeKeeperDemo CDK stack), so
# no AWS keys are stored in GitHub, and runs /opt/homekeeper/redeploy.sh on
# the instance over SSM.

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "demo/**"
      - "**.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0a6fa53b56e0e17f5
  ROLE_ARN: arn:aws:iam::796330847946:role/homekeeper-github-deploy

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show token claims (debug)
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l==2) print $0"=="; else if (l==3) print $0"="; else print $0 }' | base64 -d | jq '{iss, aud, sub, repository, ref, event_name}'

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run redeploy.sh on the host
        id: send
        run: |
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "github ${GITHUB_SHA::7}" \
            --parameters 'commands=["/opt/homekeeper/redeploy.sh 2>&1 | tail -20; sleep 8; systemctl is-active homekeeper; journalctl -u homekeeper -n 3 --no-pager"]' \
            --query Command.CommandId --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for the host
        run: |
          for i in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "${{ steps.send.outputs.id }}" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "redeploy $status"; aws ssm get-command-invocation --command-id "${{ steps.send.outputs.id }}" --instance-id "$INSTANCE_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text; exit 1 ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "${{ steps.send.outputs.id }}" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text

      - name: Check the public URL
        run: |
          for i in $(seq 1 12); do
            if curl -sf https://d157gr6uv21vdd.cloudfront.net/api/status | grep -q '"tools"'; then
              curl -s https://d157gr6uv21vdd.cloudfront.net/api/status | head -c 300; echo; exit 0
            fi
            sleep 5
          done
          echo "public URL did not answer"; exit 1
